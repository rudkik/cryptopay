; CryptoPay php-fpm tuning. Mounted at /usr/local/etc/php/conf.d/zz-cryptopay.ini
memory_limit = 512M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M
max_input_vars = 5000

expose_php = Off
date.timezone = UTC

; Money is handled with bcmath at scale 18; the default scale stays 0 so that
; every call must pass its own scale explicitly.
bcmath.scale = 0

; Log to stderr so `docker logs` picks PHP errors up.
log_errors = On
error_log = /dev/stderr
display_errors = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
