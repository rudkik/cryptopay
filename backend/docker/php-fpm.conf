; CryptoPay php-fpm pool overrides.
; Mounted at /usr/local/etc/php-fpm.d/zz-cryptopay.conf
[www]
; Compose passes every setting as an environment variable and there is no .env
; inside the container, so the workers must keep their environment.
clear_env = no

; Send worker output to the container log.
catch_workers_output = yes
decorate_workers_output = no

; Health of the pool is easier to read when php-fpm logs to stderr.
access.log = /proc/self/fd/2
