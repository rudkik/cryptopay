# CryptoPay — OpenAPI 3.1
#
# Файл отдаётся статикой из корня SPA (`/openapi.yaml`) и читается Swagger UI
# на /admin/swagger. Сборкой он не обрабатывается: правки видны сразу после
# `npm run build` (vite копирует public/ как есть) и после `docker cp` в nginx.
#
# Источник истины — SPEC.md §6.1–6.3 и код: routes/api.php,
# app/Http/Requests/**, app/Http/Resources/**. Держите файл в синхроне с ними.
openapi: 3.1.0

info:
  title: CryptoPay Merchant & Public API
  version: 1.0.0
  summary: Приём платежей в USDT/USDC (ERC-20, BEP-20, TRC-20) и продажа токенов.
  description: |
    Две публичные поверхности процессинга CryptoPay.

    * **Merchant API** (`/api/v1/*`) — server-to-server. Авторизация по API-ключу
      `Authorization: Bearer cp_live_<40 hex>`, лимит **120 запросов в минуту на ключ**.
    * **Public API** (`/api/public/*`) — hosted checkout, без авторизации.
      Credential — сам платёжный линк. Лимит 120 запросов в минуту на IP,
      страница оплаты поллит счёт раз в 5 секунд.

    Не входят в этот документ: админский API (`/api/admin/*`, Sanctum) и
    внутренний API вотчера (`/api/internal/*`, доступен только из docker-сети).

    ## Суммы

    Все денежные величины передаются **строкой в человеко-читаемых единицах**
    (`"100.500000"`), в БД — `DECIMAL(36,18)`. Считайте их bcmath / BigDecimal,
    никогда не `float`.

    ## Выбор сети платёжником

    `currency` и `network` при создании счёта **необязательны** — но только парой:
    указать одно без другого нельзя. Если оба опущены, счёт создаётся без
    депозитного адреса, `selection_required = true`, и валюту с сетью выбирает
    плательщик на checkout через `POST /api/public/invoices/{id}/select`
    (мерчант может сделать то же со своей стороны через
    `POST /api/v1/invoices/{id}/select`). Именно выбор аллоцирует адрес,
    поэтому он проходит ровно один раз: повтор — `409 invalid_state`.

    ## Идемпотентность

    На создающих запросах поддерживается заголовок `Idempotency-Key`: первый
    успешный ответ для ключа запоминается на 24 часа и повторяется с заголовком
    `Idempotent-Replay: true`.

    ## Ошибки

    Единый конверт на всей поверхности API:

    ```json
    { "error": { "code": "validation_error", "message": "...", "details": { "amount": ["..."] } } }
    ```
  contact:
    name: CryptoPay
    url: https://github.com/cryptopay
  license:
    name: UNLICENSED
    url: https://github.com/cryptopay

servers:
  - url: http://localhost:8095
    description: замените на ваш APP_URL

security:
  - ApiKeyAuth: []

tags:
  - name: Invoices
    description: Счета на оплату — создание, просмотр, выбор сети, отмена.
  - name: Token purchases
    description: Продажа токенов (token sale) за USDT/USDC.
  - name: Tokens
    description: Каталог токенов мерчанта и балансы держателей.
  - name: Networks
    description: Включённые сети и адреса контрактов.
  - name: Balances
    description: Балансы мерчанта по валютам и сетям.
  - name: Transactions
    description: Входящие ончейн-транзакции.
  - name: Merchant
    description: Профиль мерчанта и настройки вебхуков.
  - name: Public
    description: Hosted checkout — без авторизации, по платёжной ссылке.

paths:
  /api/v1/invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: Список счетов
      description: Счета текущего мерчанта, новые первыми. Пагинация Laravel.
      parameters:
        - $ref: '#/components/parameters/FilterStatus'
        - $ref: '#/components/parameters/FilterExternalId'
        - $ref: '#/components/parameters/FilterNetwork'
        - $ref: '#/components/parameters/FilterCurrency'
        - $ref: '#/components/parameters/FilterFrom'
        - $ref: '#/components/parameters/FilterTo'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница счетов.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Создать счёт
      description: |
        `currency` и `network` можно опустить — тогда сеть выбирает плательщик
        на hosted checkout, а депозитный адрес аллоцируется в момент выбора.
        Указать только одно из двух нельзя.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvoiceRequest' }
            examples:
              fixedNetwork:
                summary: Сеть задана мерчантом
                value:
                  amount: '100.5'
                  currency: USDT
                  network: tron
                  external_id: order-1
                  description: Пополнение баланса
                  customer_email: payer@example.com
                  customer_id: user-1
                  metadata: { order_id: 42 }
                  success_url: https://shop.example.com/thanks
                  cancel_url: https://shop.example.com/cart
                  expires_in: 3600
              payerSelects:
                summary: Сеть выбирает плательщик
                value:
                  amount: '25'
                  external_id: order-2
      responses:
        '201':
          description: Счёт создан.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/WatcherUnavailable' }

  /api/v1/invoices/{id}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Счёт по id
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Счёт.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/invoices/{id}/select:
    post:
      tags: [Invoices]
      operationId: selectInvoiceNetwork
      summary: Выбрать валюту и сеть
      description: |
        Мерчантская версия выбора: для интеграторов, которые рисуют свой
        checkout вместо hosted. Аллоцирует депозитный адрес, поэтому проходит
        не более одного раза на счёт — повтор отдаёт `409 invalid_state`.
        Пара `currency`/`network` должна быть среди включённых (те же,
        что в `options` публичного счёта), иначе `422`.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectNetworkRequest' }
      responses:
        '200':
          description: Счёт с аллоцированным адресом.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/WatcherUnavailable' }

  /api/v1/invoices/{id}/cancel:
    post:
      tags: [Invoices]
      operationId: cancelInvoice
      summary: Отменить счёт
      description: Только из статуса `pending`; иначе `409 invalid_state`.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Счёт в статусе `cancelled`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/networks:
    get:
      tags: [Networks]
      operationId: listNetworks
      summary: Включённые сети
      description: >-
        Только `is_enabled` сети, только включённые контракты в них и только те сети, у которых
        настроен депозитный кошелёк (xpub в базе либо env-ключ watcher'а, SPEC §3). Сеть без кошелька
        не выдаёт адресов, поэтому и не предлагается: счёт с таким `network` вернёт `422`.
      responses:
        '200':
          description: Список сетей.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Network' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/balances:
    get:
      tags: [Balances]
      operationId: listBalances
      summary: Балансы мерчанта
      description: |
        Построчно по паре (валюта, сеть) плюс `totals` — сумма по валюте
        через все сети, всегда с 6 знаками.
      responses:
        '200':
          description: Балансы и итоги.
          content:
            application/json:
              schema:
                type: object
                required: [data, totals]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Balance' }
                  totals:
                    type: object
                    description: Ключ — код валюты (`USDT` / `USDC`).
                    additionalProperties: { $ref: '#/components/schemas/BalanceTotal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Входящие транзакции
      parameters:
        - name: invoice_id
          in: query
          description: Только транзакции этого счёта.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/FilterNetwork'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransactionStatus' }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница транзакций.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/tokens:
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: Токены мерчанта
      description: Только активные (`is_active = true`), по алфавиту названия.
      responses:
        '200':
          description: Список токенов.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/tokens/{id}:
    get:
      tags: [Tokens]
      operationId: getToken
      summary: Токен по id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Токен.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/token-purchases:
    get:
      tags: [Token purchases]
      operationId: listTokenPurchases
      summary: Список покупок токена
      parameters:
        - name: customer_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TokenPurchaseStatus' }
        - name: token_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница покупок.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TokenPurchase' }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Token purchases]
      operationId: createTokenPurchase
      summary: Создать покупку токена
      description: |
        Передайте ровно одно из `token_amount` / `pay_amount` — второе будет
        посчитано по `price_usd`, зафиксированной на момент создания
        (USDT и USDC считаются равными 1 USD). Как и у счёта, `currency` и
        `network` необязательны парой: без них сеть выберет плательщик.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTokenPurchaseRequest' }
            examples:
              byTokenAmount:
                summary: Задано количество токенов
                value:
                  token_id: 01a05f1b-0a54-71da-a330-bf292b533846
                  token_amount: '1000'
                  currency: USDT
                  network: tron
                  customer_id: user-1
                  customer_email: payer@example.com
              byPayAmount:
                summary: Задана сумма к оплате, сеть выбирает плательщик
                value:
                  token_id: 01a05f1b-0a54-71da-a330-bf292b533846
                  pay_amount: '250'
                  customer_id: user-1
      responses:
        '201':
          description: Покупка и связанный с ней счёт.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema:
                type: object
                required: [purchase, invoice]
                properties:
                  purchase: { $ref: '#/components/schemas/TokenPurchase' }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/WatcherUnavailable' }

  /api/v1/token-purchases/{id}:
    get:
      tags: [Token purchases]
      operationId: getTokenPurchase
      summary: Покупка по id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Покупка.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenPurchase' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/customers/{customer_id}/holdings:
    get:
      tags: [Tokens]
      operationId: listCustomerHoldings
      summary: Балансы токенов покупателя
      parameters:
        - name: customer_id
          in: path
          required: true
          description: Идентификатор покупателя в системе мерчанта.
          schema: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Позиции покупателя.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Holding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me:
    get:
      tags: [Merchant]
      operationId: getMe
      summary: Профиль мерчанта
      description: |
        Мерчант, его балансы, настройки вебхуков (без секрета) и ключ,
        которым сделан запрос.
      responses:
        '200':
          description: Профиль.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Merchant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/public/invoices/{id}:
    get:
      tags: [Public]
      operationId: getPublicInvoice
      summary: Счёт для hosted checkout
      description: |
        Счёт без `metadata` и `customer_*`, зато с данными для отрисовки:
        `network_name`, `explorer_address_url`, `token_contract`,
        `confirmations_required`, а для невыбранного счёта — `options`.
        Страница оплаты поллит эндпоинт раз в 5 секунд.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Счёт.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicInvoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/public/invoices/{id}/select:
    post:
      tags: [Public]
      operationId: selectPublicInvoiceNetwork
      summary: Плательщик выбирает валюту и сеть
      description: |
        Записывает выбор и аллоцирует депозитный адрес. Проходит не более
        одного раза на счёт: любой повтор — `409 invalid_state`. Пара должна
        быть одной из тех, что счёт отдал в `options`, иначе `422`.

        Без авторизации: credential — сам платёжный линк. Эндпоинт делит
        публичный лимит 120 запросов в минуту с поллингом checkout.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectNetworkRequest' }
      responses:
        '200':
          description: 'Счёт с адресом и `selection_required: false`.'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicInvoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/WatcherUnavailable' }

webhooks:
  invoice.confirming:
    post:
      tags: [Invoices]
      operationId: webhookInvoiceConfirming
      summary: Первая транзакция обнаружена
      description: Счёт перешёл `pending` → `confirming`.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventHeader'
        - $ref: '#/components/parameters/WebhookDeliveryHeader'
        - $ref: '#/components/parameters/WebhookTimestampHeader'
        - $ref: '#/components/parameters/WebhookSignatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Любой 2xx считается успехом. Иначе — ретраи 1m / 5m / 30m / 2h / 6h / 24h.

  invoice.paid:
    post:
      tags: [Invoices]
      operationId: webhookInvoicePaid
      summary: Счёт оплачен полностью
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventHeader'
        - $ref: '#/components/parameters/WebhookDeliveryHeader'
        - $ref: '#/components/parameters/WebhookTimestampHeader'
        - $ref: '#/components/parameters/WebhookSignatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Любой 2xx считается успехом.

  invoice.overpaid:
    post:
      tags: [Invoices]
      operationId: webhookInvoiceOverpaid
      summary: Подтверждено больше, чем сумма счёта
      description: Считается оплаченным — `is_paid = true`.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventHeader'
        - $ref: '#/components/parameters/WebhookDeliveryHeader'
        - $ref: '#/components/parameters/WebhookTimestampHeader'
        - $ref: '#/components/parameters/WebhookSignatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Любой 2xx считается успехом.

  invoice.partially_paid:
    post:
      tags: [Invoices]
      operationId: webhookInvoicePartiallyPaid
      summary: После истечения подтверждено меньше суммы счёта
      description: |
        Средства всё равно зачислены мерчанту в ledger — включая «late payment»
        на адрес уже истёкшего или отменённого счёта.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventHeader'
        - $ref: '#/components/parameters/WebhookDeliveryHeader'
        - $ref: '#/components/parameters/WebhookTimestampHeader'
        - $ref: '#/components/parameters/WebhookSignatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Любой 2xx считается успехом.

  invoice.expired:
    post:
      tags: [Invoices]
      operationId: webhookInvoiceExpired
      summary: Истёк expires_at, ничего не получено
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventHeader'
        - $ref: '#/components/parameters/WebhookDeliveryHeader'
        - $ref: '#/components/parameters/WebhookTimestampHeader'
        - $ref: '#/components/parameters/WebhookSignatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Любой 2xx считается успехом.

  invoice.cancelled:
    post:
      tags: [Invoices]
      operationId: webhookInvoiceCancelled
      summary: Счёт отменён через API или админку
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventHeader'
        - $ref: '#/components/parameters/WebhookDeliveryHeader'
        - $ref: '#/components/parameters/WebhookTimestampHeader'
        - $ref: '#/components/parameters/WebhookSignatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Любой 2xx считается успехом.

  token_purchase.completed:
    post:
      tags: [Token purchases]
      operationId: webhookTokenPurchaseCompleted
      summary: Покупка токена оплачена и зачислена
      description: |
        `data.token_purchase` заполнен, токены начислены в
        `GET /api/v1/customers/{customer_id}/holdings`.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventHeader'
        - $ref: '#/components/parameters/WebhookDeliveryHeader'
        - $ref: '#/components/parameters/WebhookTimestampHeader'
        - $ref: '#/components/parameters/WebhookSignatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Любой 2xx считается успехом.

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: cp_live_<40 hex>
      description: |
        API-ключ мерчанта: `Authorization: Bearer cp_live_<40 hex>`.
        Выдаётся в админке и показывается один раз; в БД хранится только
        sha256 и префикс из 12 символов. Лимит 120 запросов в минуту на ключ.

  headers:
    IdempotentReplay:
      description: |
        `true`, если ответ воспроизведён из кэша идемпотентности, а не создан
        заново. Заголовок присутствует только у повтора.
      schema: { type: string, enum: ['true'] }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Произвольная строка, уникальная для попытки создания. Первый успешный
        ответ (2xx) запоминается на 24 часа и повторяется дословно с заголовком
        `Idempotent-Replay: true`. Ключ скоупится мерчантом, методом и путём.
      schema: { type: string, maxLength: 255 }
      example: order-1-attempt-1

    InvoiceId:
      name: id
      in: path
      required: true
      description: UUID счёта.
      schema: { type: string, format: uuid }

    PerPage:
      name: per_page
      in: query
      description: Размер страницы, 1–100. По умолчанию 25.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

    Page:
      name: page
      in: query
      description: Номер страницы, начиная с 1.
      schema: { type: integer, minimum: 1, default: 1 }

    FilterStatus:
      name: status
      in: query
      description: Точное совпадение по статусу счёта.
      schema: { $ref: '#/components/schemas/InvoiceStatus' }

    FilterExternalId:
      name: external_id
      in: query
      description: Точное совпадение по идентификатору заказа мерчанта.
      schema: { type: string }

    FilterNetwork:
      name: network
      in: query
      schema: { $ref: '#/components/schemas/NetworkCode' }

    FilterCurrency:
      name: currency
      in: query
      schema: { $ref: '#/components/schemas/Currency' }

    FilterFrom:
      name: from
      in: query
      description: Нижняя граница `created_at`, включительно.
      schema: { type: string, format: date-time }

    FilterTo:
      name: to
      in: query
      description: Верхняя граница `created_at`, включительно.
      schema: { type: string, format: date-time }

    WebhookEventHeader:
      name: X-CryptoPay-Event
      in: header
      required: true
      description: Имя события, дубль `event` из тела.
      schema: { $ref: '#/components/schemas/WebhookEventName' }

    WebhookDeliveryHeader:
      name: X-CryptoPay-Delivery
      in: header
      required: true
      description: |
        UUID доставки. Совпадает с `id` в теле и одинаков у всех ретраев —
        используйте его для дедупликации на своей стороне.
      schema: { type: string, format: uuid }

    WebhookTimestampHeader:
      name: X-CryptoPay-Timestamp
      in: header
      required: true
      description: Unix-время подписи в секундах. Входит в подписываемую строку.
      schema: { type: string, pattern: '^\d+$' }
      example: '1756969462'

    WebhookSignatureHeader:
      name: X-CryptoPay-Signature
      in: header
      required: true
      description: |
        `sha256=<hex>`, где hex — `hmac_sha256(webhook_secret, timestamp + "." + raw_body)`.
        Считайте подпись по **сырому** телу до парсинга JSON и сравнивайте
        константным по времени сравнением.
      schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }

  responses:
    Unauthenticated:
      description: Ключ отсутствует, невалиден или отозван.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: unauthenticated
              message: 'API key missing. Send it as `Authorization: Bearer cp_live_...`.'
              details: {}
    Forbidden:
      description: Аккаунт мерчанта отключён либо действие запрещено.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: forbidden, message: This merchant account is disabled., details: {} }
    NotFound:
      description: Ресурс не найден или не принадлежит мерчанту.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: not_found, message: Resource not found., details: {} }
    InvalidState:
      description: Ресурс не в том состоянии, в котором операция допустима.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid_state
              message: This invoice already has a currency and network.
              details: {}
    ValidationError:
      description: Тело или параметры запроса не прошли валидацию.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_error
              message: The given data was invalid.
              details:
                amount: ['The amount must be a positive decimal string, for example "100.5".']
    RateLimited:
      description: Превышен лимит запросов (120/мин на ключ, 120/мин на IP для public).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: rate_limited
              message: Too many requests. The limit is 120 requests per minute.
              details: {}
    WatcherUnavailable:
      description: |
        Вотчер недоступен, депозитный адрес выдать нельзя. Повторите запрос
        позже с тем же `Idempotency-Key`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: watcher_unavailable
              message: The address watcher service is unreachable, a deposit address cannot be allocated right now.
              details: {}

  schemas:
    ErrorCode:
      type: string
      description: |
        Машиночитаемый код ошибки. Ветвитесь по нему, а не по `message`.
      enum:
        - unauthenticated
        - forbidden
        - not_found
        - validation_error
        - invalid_state
        - rate_limited
        - request_error
        - watcher_unavailable
        - server_error

    Error:
      type: object
      description: Единый конверт ошибки на всей поверхности API (SPEC §6).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Человекочитаемое описание. Не парсите его.
            details:
              type: object
              description: |
                Для `validation_error` — карта `поле → [сообщения]`.
                Для остальных кодов обычно пустой объект.
              additionalProperties: true

    Currency:
      type: string
      enum: [USDT, USDC]

    NetworkCode:
      type: string
      enum: [ethereum, bsc, tron]

    TokenStandard:
      type: string
      enum: [ERC-20, BEP-20, TRC-20]

    InvoiceType:
      type: string
      enum: [payment, token_purchase]

    InvoiceStatus:
      type: string
      description: |
        `pending` → `confirming` → `paid`; `paid` при переплате становится
        `overpaid` (тоже оплачен). `pending`/`confirming` при истечении —
        `expired`, а если что-то подтвердилось, но меньше суммы —
        `partially_paid`. Из `pending` возможна отмена → `cancelled`.
      enum: [pending, confirming, paid, overpaid, partially_paid, expired, cancelled]

    TransactionStatus:
      type: string
      description: '`orphaned` — транзакция откатилась при реорге сети.'
      enum: [detected, confirmed, failed, orphaned]

    TokenPurchaseStatus:
      type: string
      enum: [pending, completed, expired, cancelled]

    Amount:
      type: string
      description: |
        Десятичная строка в человеко-читаемых единицах. Число знаков после
        точки соответствует decimals контракта. Никогда не парсите во float.
      pattern: '^\d+(\.\d+)?$'
      examples: ['100.500000']

    SelectionOption:
      type: object
      description: |
        Одна доступная плательщику комбинация валюты и сети. Строится по
        включённым сетям × включённым контрактам.
      required: [network, network_name, chain_id, currency, confirmations_required, standard]
      properties:
        network: { $ref: '#/components/schemas/NetworkCode' }
        network_name: { type: string, examples: [Tron] }
        chain_id:
          type: [integer, 'null']
          description: '`null` для Tron — у неё нет EVM chain id.'
          examples: [1]
        currency: { $ref: '#/components/schemas/Currency' }
        confirmations_required: { type: integer, examples: [19] }
        standard: { $ref: '#/components/schemas/TokenStandard' }

    Invoice:
      type: object
      description: |
        Канонический объект счёта Merchant API — одинаков во всех ответах
        `/api/v1/*` и в теле вебхука.
      required:
        - id
        - type
        - external_id
        - status
        - is_paid
        - selection_required
        - currency
        - network
        - amount
        - amount_received
        - amount_confirmed
        - address
        - payment_url
        - qr_payload
        - description
        - customer_email
        - customer_id
        - metadata
        - success_url
        - cancel_url
        - expires_at
        - paid_at
        - created_at
        - transactions
        - token_purchase
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/InvoiceType' }
        external_id:
          type: [string, 'null']
          description: Идентификатор заказа на стороне мерчанта.
          maxLength: 255
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        is_paid:
          type: boolean
          description: '`status` ∈ {`paid`, `overpaid`}.'
        selection_required:
          type: boolean
          description: |
            `true`, пока валюта и сеть не выбраны (адрес не аллоцирован, счёт
            в `pending` и не истёк). Пока флаг взведён, `currency`, `network`,
            `address` и `qr_payload` равны `null`, и счёт нужно провести через
            `POST /api/v1/invoices/{id}/select` либо через hosted checkout.
        currency:
          oneOf:
            - { $ref: '#/components/schemas/Currency' }
            - { type: 'null' }
          description: '`null`, пока не выбрана.'
        network:
          oneOf:
            - { $ref: '#/components/schemas/NetworkCode' }
            - { type: 'null' }
          description: '`null`, пока не выбрана.'
        amount: { $ref: '#/components/schemas/Amount' }
        amount_received:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: Сумма всех транзакций — обнаруженных и подтверждённых.
        amount_confirmed:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: Сумма только подтверждённых транзакций.
        address:
          type: [string, 'null']
          description: Депозитный адрес. `null` до выбора сети.
          examples: [TZ9m2PAUvMF62PHTLBYWdTkg6vAcVjKcGE]
        payment_url:
          type: string
          format: uri
          description: Ссылка на hosted checkout — `{APP_URL}/pay/{id}`.
        qr_payload:
          type: [string, 'null']
          description: |
            Что кодировать в QR. Для EVM — EIP-681
            `ethereum:{contract}@{chainId}/transfer?address={address}&uint256={amount_raw}`,
            для Tron — просто адрес. `null` до выбора сети.
        description: { type: [string, 'null'], maxLength: 2000 }
        customer_email: { type: [string, 'null'], format: email }
        customer_id: { type: [string, 'null'], maxLength: 255 }
        metadata:
          type: object
          description: Произвольный JSON-объект мерчанта; пустой — `{}`.
          additionalProperties: true
        success_url: { type: [string, 'null'], format: uri }
        cancel_url: { type: [string, 'null'], format: uri }
        expires_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        transactions:
          type: array
          description: Входящие транзакции на адрес счёта, старые первыми.
          items: { $ref: '#/components/schemas/Transaction' }
        token_purchase:
          oneOf:
            - { $ref: '#/components/schemas/TokenPurchase' }
            - { type: 'null' }
          description: Заполнено только для `type = token_purchase`.

    PublicInvoice:
      type: object
      description: |
        Тот же счёт для hosted checkout: без `metadata` и `customer_*`, но с
        данными для отрисовки страницы оплаты.
      required:
        - id
        - type
        - external_id
        - status
        - is_paid
        - selection_required
        - options
        - currency
        - network
        - network_name
        - amount
        - amount_received
        - amount_confirmed
        - address
        - payment_url
        - qr_payload
        - explorer_address_url
        - token_contract
        - description
        - success_url
        - cancel_url
        - expires_at
        - paid_at
        - created_at
        - confirmations_required
        - transactions
        - token_purchase
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/InvoiceType' }
        external_id: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        is_paid: { type: boolean }
        selection_required:
          type: boolean
          description: '`true` — плательщик ещё не выбрал валюту и сеть.'
        options:
          type: array
          description: |
            Из чего checkout строит выбор. Непустой массив только при
            `selection_required = true`; иначе `[]`. Отправлять в
            `POST /api/public/invoices/{id}/select` можно только пару из
            этого списка.
          items: { $ref: '#/components/schemas/SelectionOption' }
        currency:
          oneOf:
            - { $ref: '#/components/schemas/Currency' }
            - { type: 'null' }
        network:
          oneOf:
            - { $ref: '#/components/schemas/NetworkCode' }
            - { type: 'null' }
        network_name: { type: [string, 'null'], examples: [Tron] }
        amount: { $ref: '#/components/schemas/Amount' }
        amount_received: { $ref: '#/components/schemas/Amount' }
        amount_confirmed: { $ref: '#/components/schemas/Amount' }
        address: { type: [string, 'null'] }
        payment_url: { type: string, format: uri }
        qr_payload: { type: [string, 'null'] }
        explorer_address_url:
          type: [string, 'null']
          format: uri
          description: Ссылка на адрес в обозревателе сети.
        token_contract:
          oneOf:
            - { $ref: '#/components/schemas/NetworkToken' }
            - { type: 'null' }
          description: Контракт выбранной валюты в выбранной сети.
        description: { type: [string, 'null'] }
        success_url: { type: [string, 'null'], format: uri }
        cancel_url: { type: [string, 'null'], format: uri }
        expires_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        confirmations_required:
          type: integer
          description: Сколько подтверждений нужно в выбранной сети.
        transactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        token_purchase:
          oneOf:
            - { $ref: '#/components/schemas/PublicTokenPurchase' }
            - { type: 'null' }

    Transaction:
      type: object
      description: Входящий ончейн-перевод токена на депозитный адрес.
      required:
        - id
        - invoice_id
        - network
        - tx_hash
        - log_index
        - from_address
        - to_address
        - currency
        - contract_address
        - amount
        - amount_raw
        - block_number
        - confirmations
        - confirmations_required
        - status
        - explorer_url
        - credited_at
        - created_at
      properties:
        id: { type: string, format: uuid }
        invoice_id:
          type: [string, 'null']
          format: uuid
          description: '`null` для платежа на адрес, не привязанный к счёту.'
        network: { $ref: '#/components/schemas/NetworkCode' }
        tx_hash: { type: string }
        log_index:
          type: integer
          description: |
            Индекс лога Transfer в транзакции. Уникальность записи —
            по тройке (`network`, `tx_hash`, `log_index`).
        from_address: { type: [string, 'null'] }
        to_address: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        contract_address: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Amount' }
        amount_raw:
          type: string
          description: Сумма в минимальных единицах токена, как в логе.
          examples: ['100000000']
        block_number: { type: [integer, 'null'] }
        confirmations: { type: integer }
        confirmations_required: { type: integer }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        explorer_url: { type: [string, 'null'], format: uri }
        credited_at:
          type: [string, 'null']
          format: date-time
          description: Когда сумма зачислена на баланс мерчанта.
        created_at: { type: [string, 'null'], format: date-time }

    NetworkToken:
      type: object
      required: [symbol, contract_address, decimals]
      properties:
        symbol: { $ref: '#/components/schemas/Currency' }
        contract_address: { type: string }
        decimals: { type: integer, examples: [6] }

    Network:
      type: object
      required: [code, name, chain_id, confirmations_required, tokens]
      properties:
        code: { $ref: '#/components/schemas/NetworkCode' }
        name: { type: string, examples: [Tron] }
        chain_id:
          type: [integer, 'null']
          description: '`null` для Tron.'
        confirmations_required: { type: integer }
        tokens:
          type: array
          description: Включённые контракты сети, по алфавиту символа.
          items: { $ref: '#/components/schemas/NetworkToken' }

    Balance:
      type: object
      required: [currency, network, available, pending]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        network: { $ref: '#/components/schemas/NetworkCode' }
        available:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: Подтверждено и зачислено.
        pending:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: Обнаружено, но ещё не набрало подтверждений.

    BalanceTotal:
      type: object
      description: Сумма по валюте через все сети, всегда с 6 знаками.
      required: [available, pending]
      properties:
        available: { $ref: '#/components/schemas/Amount' }
        pending: { $ref: '#/components/schemas/Amount' }

    Token:
      type: object
      description: Товар token sale.
      required:
        - id
        - merchant_id
        - symbol
        - name
        - description
        - price_usd
        - decimals
        - total_supply
        - sold
        - min_purchase
        - max_purchase
        - is_active
        - image_url
        - created_at
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        symbol: { type: string, examples: [DEMO] }
        name: { type: string }
        description: { type: [string, 'null'] }
        price_usd:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: Цена одного токена в USD. USDT и USDC считаются = 1 USD.
        decimals: { type: integer, examples: [18] }
        total_supply:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
          description: '`null` — эмиссия не ограничена.'
        sold: { $ref: '#/components/schemas/Amount' }
        min_purchase: { $ref: '#/components/schemas/Amount' }
        max_purchase:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
        is_active: { type: boolean }
        image_url: { type: [string, 'null'], format: uri }
        created_at: { type: [string, 'null'], format: date-time }

    TokenPurchase:
      type: object
      required:
        - id
        - invoice_id
        - token_id
        - merchant_id
        - customer_id
        - customer_email
        - token_amount
        - price_usd
        - pay_amount
        - currency
        - status
        - completed_at
        - created_at
        - token
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        token_id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        customer_id: { type: string, maxLength: 255 }
        customer_email: { type: [string, 'null'], format: email }
        token_amount: { $ref: '#/components/schemas/Amount' }
        price_usd:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: Цена, зафиксированная в момент создания покупки.
        pay_amount:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: '`token_amount × price_usd`, сумма счёта.'
        currency:
          oneOf:
            - { $ref: '#/components/schemas/Currency' }
            - { type: 'null' }
          description: '`null`, пока валюта счёта не выбрана.'
        status: { $ref: '#/components/schemas/TokenPurchaseStatus' }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        token:
          oneOf:
            - { $ref: '#/components/schemas/Token' }
            - { type: 'null' }

    PublicTokenPurchase:
      type: object
      description: Урезанный вид покупки для страницы оплаты.
      required: [id, status, token_amount, price_usd, token]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TokenPurchaseStatus' }
        token_amount: { $ref: '#/components/schemas/Amount' }
        price_usd: { $ref: '#/components/schemas/Amount' }
        token:
          type: ['object', 'null']
          required: [symbol, name, image_url]
          properties:
            symbol: { type: string }
            name: { type: string }
            image_url: { type: [string, 'null'], format: uri }

    Holding:
      type: object
      description: Позиция покупателя по одному токену.
      required: [token, customer_id, amount, updated_at]
      properties:
        token:
          oneOf:
            - { $ref: '#/components/schemas/Token' }
            - { type: 'null' }
        customer_id: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        updated_at: { type: [string, 'null'], format: date-time }

    ApiKey:
      type: object
      description: Метаданные ключа. Сам ключ показывается только при создании.
      required: [id, merchant_id, name, key_prefix, last_used_at, revoked_at, created_at]
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        name: { type: string }
        key_prefix:
          type: string
          description: Первые 12 символов ключа.
          examples: [cp_live_ab12]
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }

    Merchant:
      type: object
      description: Ответ `GET /api/v1/me`. Секрет вебхуков не возвращается никогда.
      required: [id, name, email, webhook_url, is_active, settings, underpayment_tolerance, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        webhook_url: { type: [string, 'null'], format: uri }
        is_active: { type: boolean }
        settings:
          type: object
          additionalProperties: true
        underpayment_tolerance:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: |
            Недоплата в единицах валюты, которую всё ещё считаем полной оплатой.
        created_at: { type: [string, 'null'], format: date-time }
        balances:
          type: array
          items: { $ref: '#/components/schemas/Balance' }
        api_keys:
          type: array
          items: { $ref: '#/components/schemas/ApiKey' }
        webhook:
          type: object
          required: [url, configured, events, signature_header]
          properties:
            url: { type: [string, 'null'], format: uri }
            configured:
              type: boolean
              description: '`false` — вебхуки не настроены и не отправляются.'
            events:
              type: array
              items: { $ref: '#/components/schemas/WebhookEventName' }
            signature_header: { type: string, examples: [X-CryptoPay-Signature] }
        api_key:
          oneOf:
            - { $ref: '#/components/schemas/ApiKey' }
            - { type: 'null' }
          description: Ключ, которым сделан этот запрос.

    CreateInvoiceRequest:
      type: object
      required: [amount]
      properties:
        amount:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: |
            Строка вида `"100.5"`: до 10 цифр до точки и до 18 после,
            в диапазоне 0.000001 … 1000000000.
        currency:
          oneOf:
            - { $ref: '#/components/schemas/Currency' }
            - { type: 'null' }
          description: |
            Необязательно, но только вместе с `network`. Опустите оба — валюту
            и сеть выберет плательщик (`selection_required: true`).
        network:
          oneOf:
            - { $ref: '#/components/schemas/NetworkCode' }
            - { type: 'null' }
          description: Необязательно, но только вместе с `currency`.
        external_id: { type: [string, 'null'], maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 2000 }
        customer_email: { type: [string, 'null'], format: email, maxLength: 255 }
        customer_id: { type: [string, 'null'], maxLength: 255 }
        metadata:
          type: [object, 'null']
          description: Произвольный объект ограниченного размера и глубины.
          additionalProperties: true
        success_url:
          type: [string, 'null']
          format: uri
          maxLength: 2000
          description: Только схемы `http`/`https`.
        cancel_url:
          type: [string, 'null']
          format: uri
          maxLength: 2000
          description: Только схемы `http`/`https`.
        expires_in:
          type: [integer, 'null']
          minimum: 60
          maximum: 86400
          default: 3600
          description: Время жизни счёта в секундах.
      additionalProperties: false

    CreateTokenPurchaseRequest:
      type: object
      required: [token_id, customer_id]
      description: Нужно передать хотя бы одно из `token_amount` / `pay_amount`.
      properties:
        token_id: { type: string, format: uuid }
        token_amount:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
          description: Обязательно, если не передан `pay_amount`.
        pay_amount:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
          description: Обязательно, если не передан `token_amount`.
        currency:
          oneOf:
            - { $ref: '#/components/schemas/Currency' }
            - { type: 'null' }
          description: Необязательно, но только вместе с `network`.
        network:
          oneOf:
            - { $ref: '#/components/schemas/NetworkCode' }
            - { type: 'null' }
          description: Необязательно, но только вместе с `currency`.
        customer_id: { type: string, maxLength: 255 }
        customer_email: { type: [string, 'null'], format: email, maxLength: 255 }
        external_id: { type: [string, 'null'], maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 2000 }
        success_url: { type: [string, 'null'], format: uri, maxLength: 2000 }
        cancel_url: { type: [string, 'null'], format: uri, maxLength: 2000 }
        metadata:
          type: [object, 'null']
          additionalProperties: true
        expires_in:
          type: [integer, 'null']
          minimum: 60
          maximum: 86400
          default: 3600
      additionalProperties: false

    SelectNetworkRequest:
      type: object
      description: |
        Тело выбора валюты и сети. Оба поля обязательны, и пара должна быть
        среди включённых — тех же, что счёт отдаёт в `options`.
      required: [currency, network]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        network: { $ref: '#/components/schemas/NetworkCode' }
      additionalProperties: false
      examples:
        - { currency: USDT, network: tron }

    InvoiceEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Invoice' }

    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first: { type: [string, 'null'], format: uri }
        last: { type: [string, 'null'], format: uri }
        prev: { type: [string, 'null'], format: uri }
        next: { type: [string, 'null'], format: uri }

    PaginationMeta:
      type: object
      description: Стандартный `meta` пагинатора Laravel.
      required: [current_page, from, last_page, path, per_page, to, total]
      properties:
        current_page: { type: integer, examples: [1] }
        from: { type: [integer, 'null'] }
        last_page: { type: integer }
        path: { type: string, format: uri }
        per_page: { type: integer }
        to: { type: [integer, 'null'] }
        total: { type: integer }
        links:
          type: array
          description: Готовые ссылки для пагинатора в UI.
          items:
            type: object
            properties:
              url: { type: [string, 'null'], format: uri }
              label: { type: string }
              page: { type: [integer, 'null'] }
              active: { type: boolean }

    WebhookEventName:
      type: string
      enum:
        - invoice.confirming
        - invoice.paid
        - invoice.overpaid
        - invoice.partially_paid
        - invoice.expired
        - invoice.cancelled
        - token_purchase.completed

    WebhookEvent:
      type: object
      description: |
        Тело всех исходящих вебхуков (SPEC §6.2). Отправляется `POST` на
        `merchant.webhook_url`. Успех — любой 2xx; иначе 6 попыток с
        интервалами 1m / 5m / 30m / 2h / 6h / 24h.

        Доставки могут дублироваться и приходить не по порядку: дедуплицируйте
        по `id` и сверяйтесь со `status` счёта, а не с фактом события.
      required: [id, event, created_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: UUID доставки, дубль `X-CryptoPay-Delivery`.
        event: { $ref: '#/components/schemas/WebhookEventName' }
        created_at: { type: string, format: date-time }
        data:
          type: object
          required: [invoice]
          properties:
            invoice: { $ref: '#/components/schemas/Invoice' }
            token_purchase:
              oneOf:
                - { $ref: '#/components/schemas/TokenPurchase' }
                - { type: 'null' }
