name: cryptopay

# Ротация логов: без неё json-file растёт до размера диска (watcher и queue
# пишут непрерывно). 10m x 5 = максимум 50 МБ на контейнер.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Запрещаем процессу поднимать привилегии через setuid-бинари (su, sudo, ping).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-CryptoPay}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8095}
  APP_KEY: ${APP_KEY:-}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-cryptopay}
  DB_USERNAME: ${DB_USERNAME:-cryptopay}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_CLIENT: predis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token-please}
  WATCHER_URL: http://watcher:3100
  # Время жизни токена админки (Sanctum), минуты. 720 = 12 часов.
  SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-720}
  # Таймаут доставки вебхука мерчанту, секунды.
  WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10}
  # SSRF-предохранитель: по умолчанию вебхуки НЕ ходят на приватные/loopback
  # адреса и на compose-имена. true — только для локального демо.
  WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
  # Кнопка "Simulate payment" создаёт транзакцию в обход блокчейна. По умолчанию
  # ВЫКЛЮЧЕНА: включать осознанно через .env на демо-стенде (make check-env
  # ругается, если она включена вместе с APP_ENV=production).
  SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
  # Модуль token sale (продажа токенов). По умолчанию ВЫКЛЮЧЕН: маршруты
  # /tokens, /token-purchases и /customers/{id}/holdings отвечают 404, пока
  # флаг не включён. На приём платежей не влияет.
  TOKEN_SALE_ENABLED: ${TOKEN_SALE_ENABLED:-false}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cryptopay.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}

services:
  postgres:
    image: postgres:16-alpine
    <<: *hardening
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cryptopay}
      POSTGRES_USER: ${DB_USERNAME:-cryptopay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Порт наружу не публикуется: доступ только из docker-сети.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cryptopay} -d ${DB_DATABASE:-cryptopay}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    <<: *hardening
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # requirepass включается, только если пароль задан: пустой --requirepass ""
    # у redis означает «без пароля», а redis-cli -a "" ловит ошибку AUTH.
    command:
      - sh
      - -c
      - >-
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ./backend
    <<: *hardening
    logging: *default-logging
    environment: *backend-env
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue:
    build:
      context: ./backend
    <<: *hardening
    logging: *default-logging
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,webhooks", "--tries=3", "--sleep=2", "--max-time=3600"]
    environment:
      <<: *backend-env
      SKIP_MIGRATIONS: "true"
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    <<: *hardening
    logging: *default-logging
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *backend-env
      SKIP_MIGRATIONS: "true"
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  watcher:
    build:
      context: ./watcher
    <<: *hardening
    logging: *default-logging
    # Кроме /app/data (том) и /tmp писать некуда — держим корень только на чтение.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PORT: 3100
      # APP_ENV, а не NODE_ENV: NODE_ENV=production зашит в Dockerfile ради
      # `npm ci --omit=dev` и не отражает окружение развёртывания. При любом
      # значении, кроме local/dev/test, watcher откажется стартовать с пустым
      # или дефолтным INTERNAL_API_TOKEN.
      APP_ENV: ${APP_ENV:-production}
      # Внутренний порт nginx: /api/internal наружу (на :80) отдаёт 404.
      BACKEND_URL: http://nginx:8081
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token-please}
      ETH_RPC_URL: ${ETH_RPC_URL:-https://ethereum-rpc.publicnode.com}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-rpc.publicnode.com}
      TRON_API_URL: ${TRON_API_URL:-https://api.trongrid.io}
      TRON_API_KEY: ${TRON_API_KEY:-}
      EVM_XPUB: ${EVM_XPUB:-}
      TRON_XPUB: ${TRON_XPUB:-}
      WATCHER_ENABLED: ${WATCHER_ENABLED:-true}
      EVM_BATCH_BLOCKS: ${EVM_BATCH_BLOCKS:-20}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /app/data
    volumes:
      - watcher-data:/app/data
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    <<: *hardening
    logging: *default-logging
    # Единственный сервис с публикацией порта. Порт 8081 (internal API для
    # watcher'а) намеренно НЕ публикуется.
    ports:
      - "${APP_PORT:-8095}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  app-storage:
  watcher-data:
