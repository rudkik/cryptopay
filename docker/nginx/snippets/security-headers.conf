# Security-заголовки CryptoPay.
#
# ВАЖНО: в nginx `add_header` НЕ наследуется, если в текущем блоке есть хотя бы
# один свой `add_header`. Поэтому этот сниппет подключается и на уровне server,
# и в каждой location, где добавляются собственные заголовки (Cache-Control и т.п.).
#
# `always` — чтобы заголовки уходили и на 4xx/5xx (404 SPA, 429 rate limit).

add_header X-Content-Type-Options "nosniff" always;

# Админка и hosted checkout не предназначены для встраивания. Страницу оплаты
# /pay/{id} мерчант должен открывать редиректом или в новом окне, НЕ в iframe:
# иначе не работает копирование адреса и возможен clickjacking поверх суммы.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

# CSP под конкретную сборку Vite (проверено по frontend/dist/index.html):
#   script-src 'self'        — единственный <script type="module" src="/assets/...">,
#                              инлайновых скриптов в сборке нет, eval/new Function тоже;
#   style-src  'unsafe-inline' — Vue проставляет style="" атрибуты (QR, прогресс-бар),
#                              + Google Fonts отдаёт внешний stylesheet;
#   font-src   fonts.gstatic.com data: — файлы шрифтов Inter/JetBrains Mono;
#   img-src    'self' data: https: — favicon.svg и QR (инлайновый <svg>), плюс
#                              tokens.image_url: логотип токена задаётся админом и
#                              лежит на произвольном внешнем хосте, поэтому 'self'
#                              его ломает (проверено фронтовым аудитом);
#   connect-src 'self'       — axios ходит только в /api того же origin;
#   frame-ancestors 'none'   — дубль X-Frame-Options для современных браузеров.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; manifest-src 'self'" always;
