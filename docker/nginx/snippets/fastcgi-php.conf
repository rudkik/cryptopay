# Общая часть проксирования в php-fpm (app:9000).
#
# Имя app резолвится через встроенный DNS docker'а при каждом запросе (а не один
# раз на старте nginx): после пересоздания контейнера app у него новый IP, и
# nginx со статическим адресом отвечал бы 502 до своего перезапуска.
resolver 127.0.0.11 valid=10s ipv6=off;
set $php_upstream app:9000;
fastcgi_pass $php_upstream;
fastcgi_split_path_info ^(.+\.php)(/.+)$;
fastcgi_index index.php;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param PATH_INFO $fastcgi_path_info;
fastcgi_read_timeout 120;
# На случай, если expose_php когда-нибудь вернут в On.
fastcgi_hide_header X-Powered-By;
