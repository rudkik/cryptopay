# ---------------------------------------------------------------------------
# Rate limiting (http-контекст: conf.d/*.conf инклудится внутрь http {}).
#
# Ключ — $binary_remote_addr. За внешним балансировщиком все клиенты сольются
# в один IP; тогда ключ надо менять на $http_x_forwarded_for и включать
# real_ip_module. Внутри compose балансировщика нет.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=cp_public:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=cp_login:10m  rate=10r/m;
limit_req_status 429;

# ---------------------------------------------------------------------------
# Публичный сервер: SPA + /api/v1, /api/public, /api/admin.
# ЕДИНСТВЕННЫЙ порт, опубликованный наружу (compose: APP_PORT -> 80).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    server_tokens off;

    # В приложении нет ни одной загрузки файлов: и /api, и SPA обходятся
    # килобайтами JSON. 1m отсекает мусорные тела до того, как их увидит PHP.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    root /var/www/html/public;   # Laravel public (для /api и /index.php)
    index index.php;

    gzip on;
    gzip_vary on;
    # application/json намеренно НЕ сжимаем: ответы /api содержат
    # админский токен и пользовательский ввод в одном теле — классическая
    # заготовка под BREACH, если фронт стоит за TLS. Статика такого не несёт.
    gzip_types text/plain text/css application/javascript image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Единый JSON для 429, чтобы фронт не спотыкался об nginx'овый HTML (SPEC §6).
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests.","details":{}}}';
    }

    # --- Скрытые файлы (.env, .git, .htaccess) ---
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Internal API: наружу закрыт ---
    #
    # Список «частных сетей» здесь бесполезен: docker публикует порт через DNAT,
    # и запрос с хоста приходит с адреса шлюза бриджа (172.31.0.1), то есть уже
    # внутри 172.16.0.0/12. Отличить внешнего клиента по IP невозможно.
    # Поэтому /api/internal вынесен на отдельный порт 8081 (server ниже), который
    # НЕ публикуется в compose и виден только из docker-сети. Здесь — глухой 404,
    # который вдобавок не подтверждает существование эндпоинта.
    location ^~ /api/internal/ {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Resource not found.","details":{}}}';
    }

    # --- Логин админки: тормозим перебор паролей ---
    location = /api/admin/auth/login {
        limit_req zone=cp_login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # --- Hosted checkout: без авторизации, поллится каждые 5с ---
    #
    # Арифметика: страница /pay опрашивает /api/public каждые 5с => 12 req/min
    # на открытую вкладку. 60r/m держит ~5 одновременных плательщиков с одного
    # IP (общий NAT офиса), burst 20 гасит всплеск при открытии страницы.
    # Троттлить checkout опаснее, чем терпеть лишние запросы: клиент просто не
    # увидит, что его платёж подтверждён. За внешним прокси ключ ($binary_remote_addr)
    # схлопнется в один IP — тогда переключить на real_ip + X-Forwarded-For.
    location ^~ /api/public/ {
        limit_req zone=cp_public burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # --- Остальной backend API ---
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include /etc/nginx/snippets/fastcgi-php.conf;
    }

    location ~ \.php$ { return 404; }

    # --- Frontend SPA (Vue build) ---
    # OpenAPI spec: nginx's mime.types has no yaml entry (would be octet-stream).
    location = /openapi.yaml {
        root /usr/share/nginx/html;
        default_type application/yaml;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

# ---------------------------------------------------------------------------
# Внутренний сервер: только /api/internal/* для watcher'а.
# Порт 8081 не публикуется наружу (см. docker-compose.yml), поэтому добраться
# сюда можно лишь из docker-сети. X-Internal-Token остаётся вторым рубежом.
# ---------------------------------------------------------------------------
server {
    listen 8081;
    server_name _;

    server_tokens off;
    # /api/internal/transactions/batch шлёт до 200 транзакций за раз.
    client_max_body_size 4m;

    root /var/www/html/public;
    index index.php;

    include /etc/nginx/snippets/security-headers.conf;

    # Defense in depth: даже если порт когда-нибудь опубликуют, чужие подсети
    # сюда не пройдут.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.0/8;
    deny all;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    location ^~ /api/internal/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include /etc/nginx/snippets/fastcgi-php.conf;
    }

    # Всё остальное на внутреннем порту не обслуживается.
    location / {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Resource not found.","details":{}}}';
    }
}
